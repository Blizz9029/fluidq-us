name: Refresh screener

on:
  schedule:
    # 23:00 UTC daily = 7pm ET, three hours after the US close, so quotes
    # and the day's bars have fully settled. 04:30 IST the next morning.
    - cron: "0 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Without this the archive commit below would retrigger the workflow forever.
    paths-ignore:
      - "data/screen.json"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build screener data + site
        run: python build.py

      - name: Verify the build is fresh and complete
        run: python verify.py

      # Commits the day's metrics back to main. Two reasons: it builds a
      # point-in-time archive (what "Historical Ranks" would need), and the
      # commit counts as repo activity, so GitHub never disables the cron
      # for inactivity.
      - name: Archive today's data
        run: |
          git config user.name "fluidq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/screen.json
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
